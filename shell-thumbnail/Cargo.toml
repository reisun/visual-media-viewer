[package]
name = "visual-media-viewer-thumbnail"
version = "0.6.0"
edition = "2021"
license = "MIT"

[lib]
name = "VisualMediaViewerThumbnail"
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
