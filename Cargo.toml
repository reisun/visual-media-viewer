[package]
name = "visual-media-viewer"
version = "0.3.0"
edition = "2021"
description = "High-performance image viewer powered by Rust + wgpu + egui"
license = "MIT"

[[bin]]
name = "VisualMediaViewer"
path = "src/main.rs"

[dependencies]
wgpu = "24"
egui = "0.31"
eframe = { version = "0.31", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] }
natord = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
ffmpeg-next = "7"
cpal = "0.15"
turbojpeg = "1"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Imaging_D2D",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
