[package]
name = "visual-media-viewer"
version = "0.1.0"
edition = "2021"
description = "High-performance image viewer powered by Rust + wgpu + egui"

[dependencies]
wgpu = "24"
egui = "0.31"
eframe = { version = "0.31", features = ["wgpu"] }
image = "0.25"
natord = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
